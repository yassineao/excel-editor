  <div class="overflow-x-auto">
    <table class="w-full min-w-160 border-collapse text-sm">
      <caption class="sr-only">Tabelle 1 mit vier Spalten und fünf bearbeitbaren Zeilen</caption>
      <thead class="bg-slate-100 text-slate-600">
      <tr>
        <th scope="col" class="w-12 border border-slate-200 p-2"><span class="sr-only">Zeile</span></th>
        @for (col of cols(); track col) {
          <th>{{ getColumnLetter(col) }}</th>
        }
      </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row) {
          <tr>
            <th scope="row" class="border border-slate-200 bg-slate-50 p-2">
              {{ row + 1 }}
            </th>

            @for (col of cols(); track col) {
              <td class="border border-slate-200">
                <input
                  #cellInput
                  type="text"
                  [attr.aria-label]="'Cell ' + row + '-' + col"
                  class="w-full min-w-32 px-3 py-2"
                  [value]="sheet().cells.get(row + ',' + col)?.value ?? ''"
                  (input)="updateCell(row, col, cellInput.value)"
                >
              </td>
            }
          </tr>
        }

      </tbody>
    </table>
  </div>
