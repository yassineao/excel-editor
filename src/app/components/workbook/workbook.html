<section id="spreadsheet" aria-labelledby="workbook-title" class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <header class="border-b border-slate-200 px-5 py-4">
    <h2 id="workbook-title" class="text-lg font-semibold">{{ workbookService.name() }}</h2>
    <p class="text-sm text-slate-500">Tabelle 1</p>
  </header>

  <app-toolbar class="block" />
  @if (workbookService.currentSheet(); as sheet) {
    <app-spreadsheet class="block" [sheet]="sheet" />
  }

  <div class="flex items-center justify-between border-t border-slate-200 bg-slate-50 px-5 py-3 text-sm">
    <span class="rounded-md bg-emerald-100 px-3 py-1 font-medium text-emerald-800">Tabelle 1</span>
    <span class="text-slate-500">5 Zeilen · 4 Spalten</span>
  </div>
</section>
