<section aria-label="Werkzeuge" class="space-y-4 border-b border-slate-200 bg-slate-50 px-5 py-4">
  <div class="flex flex-wrap gap-4">
    <fieldset class="flex min-w-0 flex-wrap items-center gap-2">
      <legend class="mb-3 text-xs font-semibold uppercase tracking-widest text-slate-500">SHEET</legend>
      <button type="button" (click)="newSheet.emit()" class="file-button">Neu</button>
      <button type="button" (click)="sheetDialog.showModal()" aria-haspopup="dialog" class="file-button">Öffnen</button>
      <button type="button" (click)="deleteSheet.emit()" class="file-button file-button-danger">löschen</button>
    </fieldset>
    <dialog
      #popup
      class="m-auto rounded-lg border border-slate-200 p-6 shadow-xl
         backdrop:bg-black/40"
    >
      <h2 class="mb-4 text-lg font-semibold">
        Excel importieren
      </h2>

      <p class="mb-4 text-sm text-slate-600">
        Wähle eine Excel-Datei aus.
      </p>

      <input
        aria-label="Excel-Datei auswählen"
        aria-describedby="import-file-status"
        type="file"
        accept=".xlsx"
        (input)="onFileSelected($event)"
        (change)="onFileSelected($event)"
        class="w-full rounded-lg border border-slate-300
         bg-slate-50 p-2 text-sm text-slate-700
         shadow-sm transition-all duration-200
         hover:border-emerald-500 hover:bg-white
         focus:outline-none focus:ring-2 focus:ring-emerald-500
         file:mr-4 file:cursor-pointer file:rounded-md
         file:border-0 file:bg-emerald-100
         file:px-4 file:py-2 file:font-medium
         file:text-emerald-800
         file:transition-colors
         file:hover:bg-emerald-200"
      />

      <div id="import-file-status" role="status" aria-live="polite" class="mt-3 text-sm">
        @if (selectedFile(); as file) {
          <p class="rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-emerald-800">
            <span class="block break-all font-semibold">{{ file.name }}</span>
            <span>Bereit zum Importieren.</span>
          </p>
        } @else {
          <p class="text-slate-500">Keine Datei ausgewählt.</p>
        }
      </div>

      <div class="mt-3 flex justify-end gap-2">
        <button
          type="button"
          (click)="popup.close()"
          class="rounded-md border border-slate-300 px-4 py-2 text-sm
           hover:bg-slate-100 transition"
        >
          Abbrechen
        </button>

        <button
          type="button"
          [disabled]="!selectedFile()"
          (click)="importFile(); popup.close()"
          class="rounded-md bg-emerald-700 px-4 py-2 text-sm text-white
           hover:bg-emerald-800 transition
           disabled:cursor-not-allowed disabled:opacity-50"
        >
          Importieren
        </button>
      </div>
    </dialog>
<!--    <fieldset class="flex flex-wrap gap-2">-->
<!--      <legend class="mb-2 text-xs font-semibold text-slate-600">Bearbeiten</legend>-->
<!--      <button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm">Rückgängig</button>-->
<!--      <button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm">Wiederholen</button>-->
<!--    </fieldset>-->
    <fieldset class="flex gap-2">
      <legend class="mb-2 text-xs font-semibold text-slate-600">DATEI</legend>
      <button type="button" (click)="saveRequested.emit()" class="file-button file-button-primary">Speichern</button>
      <button type="button" (click)="popup.showModal()" class="file-button">Importieren</button>
      <button type="button" (click)="exportSelected.emit()" class="file-button">Exportieren</button>
    </fieldset>
  </div>

</section>

<dialog #sheetDialog aria-labelledby="sheet-dialog-title" class="m-auto w-full max-w-md rounded-xl border border-slate-200 bg-white p-0 shadow-xl backdrop:bg-slate-900/40">
  <header class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
    <h2 id="sheet-dialog-title" class="text-lg font-semibold text-slate-900">Tabelle öffnen</h2>
    <button type="button" autofocus (click)="sheetDialog.close()" aria-label="Schließen" class="rounded-md px-3 py-1 text-xl text-slate-500 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-emerald-600">×</button>
  </header>
  <ul class="max-h-80 space-y-2 overflow-y-auto p-5">
    @for (sheet of sheets(); track sheet.id) {
      <li>
        <button type="button" (click)="sheetSelected.emit(sheet.id); sheetDialog.close()" class="flex w-full items-center justify-between gap-4 rounded-lg border border-slate-200 px-4 py-3 text-left hover:border-emerald-500 hover:bg-emerald-50 focus-visible:outline-2 focus-visible:outline-emerald-600">
          <span class="min-w-0 break-words font-medium text-slate-900">{{ sheet.name }}</span>
          <span class="shrink-0 text-xs text-slate-500">{{ sheet.rows }} Zeilen · {{ sheet.columns }} Spalten</span>
        </button>
      </li>
    } @empty {
      <li class="py-6 text-center text-sm text-slate-500">Noch keine Tabellen vorhanden.</li>
    }
  </ul>
</dialog>
